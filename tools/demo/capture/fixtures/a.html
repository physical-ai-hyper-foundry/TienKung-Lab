<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Fixture A</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #f6f7f9; color: #111; }
  header { background: #2b59c3; color: #fff; padding: 20px 40px; font-size: 22px; }
  main { padding: 40px; }
  button { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 1px solid #2b59c3; background: #fff; cursor: pointer; }
  button:hover { background: #e8eefc; }
  input { font-size: 16px; padding: 8px 12px; width: 320px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; margin: 20px 0; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .spacer { height: 1200px; }
  #prefs { color: #666; font-size: 13px; }
</style></head>
<body>
<header>Fixture A · 작업 목록</header>
<main>
  <p id="prefs"></p>
  <div class="card">
    <button id="make">새 작업</button>
    <span id="status" style="margin-left:12px">대기 중</span>
  </div>
  <div class="card"><label>작업 이름 <input id="name" placeholder="예: X2 평지 보행"></label></div>
  <div class="spacer"></div>
  <div class="card">
    <a id="open-b" href="b.html" target="_blank">Model Studio 에서 열기 ↗</a>
  </div>
</main>
<script>
  document.getElementById('prefs').textContent =
    'localStorage: foundry.locale=' + localStorage.getItem('foundry.locale') +
    ', lm_theme_v2=' + localStorage.getItem('lm_theme_v2') + ', navigator.language=' + navigator.language;
  document.getElementById('make').onclick = () => { document.getElementById('status').textContent = '작업 생성됨 ✓'; };
</script>
</body></html>
